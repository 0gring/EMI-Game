# Publishes the game to GitHub Pages so it can be opened on a tablet.
# Enable once under Settings -> Pages -> Source: GitHub Actions.

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push should replace an in-flight deploy rather than queue behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # There is no build step: the game is plain ES modules, so the repository
      # is the artifact. Only the tooling is left out.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js src assets _site/
          echo "Published $(date -u +%FT%TZ)" > _site/build.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

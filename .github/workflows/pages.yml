# Publishes the game to GitHub Pages so it can be opened on a tablet.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions". Nothing else is
# needed; the next push (or a manual run from the Actions tab) deploys.

name: Deploy to Pages

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push should replace an in-flight deploy rather than queue behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The game itself has no build step - it is plain ES modules, so the
      # repository is the site. The only thing built here is the standalone
      # single-file copy that gets published alongside it.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js src assets _site/
          npm ci
          node tools/bundle.mjs
          cp dist/emi-world.html _site/emi-world.html
          echo "Published $(date -u +%FT%TZ) from ${GITHUB_SHA::7}" > _site/build.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

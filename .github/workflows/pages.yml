# Publishes the game to GitHub Pages so it can be opened on a tablet.
#
# Pages is enabled on this repository with its source set to "GitHub Actions",
# so every push to the default branch deploys automatically and the site lands
# at https://0gring.github.io/EMI-Game/ with the standalone single-file copy
# alongside it at /emi-world.html.

name: Deploy to Pages

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push should replace an in-flight deploy rather than queue behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The game itself has no build step - it is plain ES modules, so the
      # repository is the site. The only thing built here is the standalone
      # single-file copy that gets published alongside it.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest adventure.html adventure.webmanifest sw.js src assets _site/
          npm ci
          node tools/bundle.mjs
          node tools/bundle.mjs --adventure
          cp dist/emi-world.html _site/emi-world.html
          cp dist/emi-adventure.html _site/emi-adventure.html
          echo "Published $(date -u +%FT%TZ) from ${GITHUB_SHA::7}" > _site/build.txt

      # enablement asks GitHub to turn Pages on if it ever gets turned off, so
      # a fresh clone of this repository deploys without a visit to Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

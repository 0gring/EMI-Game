# Builds "האי הקסום של אמי" - the Godot game in godot/ - as an installable
# Android app (APK) and publishes it as the release "android-latest":
#
#   https://github.com/0gring/EMI-Game/releases/download/android-latest/emi-magic-island.apk
#
# Before exporting, the same play-test that runs locally drives the real game
# with simulated fingers; a failing check stops the build, so a broken game is
# never published.
#
# The app keeps the package name and signing key of the earlier build
# (android/app/emi-island.keystore), and its version code is the run number
# plus 100, so a new APK always installs straight over whatever is on the tablet.

name: Android app

on:
  push:
    paths:
      - 'godot/**'
      - 'android/app/emi-island.keystore'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Cache export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Install export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      # Godot finds the Android SDK and JDK through its editor settings.
      - name: Point Godot at the Android SDK
        run: |
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres "editor_settings-${GODOT_VERSION%.*}.tres"; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
              "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/$f
          done

      - name: Import the project
        run: godot --headless --path godot --import || true

      - name: Play-test the game
        run: |
          godot --headless --path godot -- --autotest 2>&1 | tee autotest.log
          grep -q "^PASS" autotest.log
          ! grep -q "SCRIPT ERROR" autotest.log

      - name: Export the APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/android/app/emi-island.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: emi
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: emi-island
        run: |
          sed -i "s/^version\/code=.*/version\/code=$((GITHUB_RUN_NUMBER + 100))/" godot/export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"2.0.${GITHUB_RUN_NUMBER}\"/" godot/export_presets.cfg
          godot --headless --path godot --export-release "Android" "$PWD/emi-magic-island.apk"
          ls -la emi-magic-island.apk

      - uses: actions/upload-artifact@v4
        with:
          name: emi-magic-island-apk
          path: emi-magic-island.apk

      - name: Publish the download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest emi-magic-island.apk \
            --target "$GITHUB_SHA" \
            --title "האי הקסום של אמי - Android" \
            --notes "Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7} (${GITHUB_REF_NAME}). Open this page on the tablet and tap emi-magic-island.apk to install."
